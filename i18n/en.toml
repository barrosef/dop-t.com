[dca_title]
other = "How the core verifies its callers (ADR-0022)"

[dca_desc]
other = "The person signs in at Identity Platform and the cockpit holds the token. The cockpit sends it to the BFF as a bearer. The BFF forwards it whole to the core and adds a signed assertion naming caller, actor, kind, account, session and expiry; on Cloud Run it also carries the invoker token. Callers with no person send the assertion only. The core's interceptor verifies the token through the identity port, verifies the assertion's HMAC with the caller's key, refuses when token and assertion name different actors, applies the mode, and leaves the decision to authorization. Transport authentication — Cloud Run IAM or a network policy — is additional."

