baseURL = "https://dop-t.com/"
title = "DOP"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
# Three pages per language and no taxonomy: a tags page would be an empty box.
disableKinds = ["taxonomy", "term"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML"]

# ── Languages ────────────────────────────────────────────────────────────────
# Both are first-class. The translation check in `make check` refuses a page
# that exists in one language and not the other, so a half-translated site
# cannot ship — the failure mode a product site cannot afford, because the
# missing half is what a prospect happens to land on.

[languages]
  # contentDir is NOT optional here. Without it Hugo reads `content/en/` as a
  # SECTION called "en" instead of as English's content root: the home page ends
  # up with no `_index.md` at all, renders with an empty body, and still builds
  # green — the title comes from the site config, so the page looks plausible
  # and says nothing.
  [languages.en]
    languageName = "English"
    contentDir = "content/en"
    weight = 1
  [languages.pt-br]
    languageName = "Português"
    contentDir = "content/pt-br"
    weight = 2

# ── Content ──────────────────────────────────────────────────────────────────
# EVERY block below renders only when its value is non-empty. A blank is
# invisible, never an empty box or a bracketed placeholder — the difference
# between a site that reads as lean and one that reads as unfinished.
#
# The convention is inherited from barrosef.com, where it works.

[params]
  # The meta description falls back to the i18n tagline when this is empty.
  description = ""

  # Where the code lives. The primary call to action on every page points
  # here — "built in the open" is verifiable, not claimed.
  [params.github]
    url = "https://github.com/barrosef/dop"
    org = "https://github.com/barrosef"
    adrBase = "https://github.com/barrosef/dop/blob/main/docs/adr"

  # The three numbers on the home's "where it stands" block. Each has a source
  # in the umbrella repository (docs/ROADMAP.md, docs/adr/); update them here,
  # never in a layout.
  [params.status]
    subprojectsDesigned = "5"
    subprojectsTotal = "7"
    latestADR = "0030"

  # The four plans. They are ALSO a catalog in the product's database, read by
  # the sign-up wizard — see the DOP platform's profile-onboarding spec.
  #
  # These two lists WILL diverge, because nothing links them. That is accepted:
  # this one is marketing copy and may say "from small teams to the whole
  # engineering org"; the product's one is data the agent operates on. What must
  # never diverge is the set of NAMES. If a plan is added or renamed, it changes
  # in both places or the site lies about what somebody can buy.
  [params.plans]
    enabled = false

  # Legal pages. These are not decoration and not optional:
  #
  # Google's OAuth verification — the step that moves the consent screen out of
  # Testing and removes the seven-day token expiry — REQUIRES a privacy policy
  # hosted on a domain the applicant owns. So this site is a hard dependency of
  # the platform's production sign-in, not a marketing side quest.
  [params.legal]
    privacyPath = ""
    termsPath = ""

  # Where the product lives. Empty until the environment answers.
  [params.app]
    signInURL = ""
