[dfe_title]
other = "O motor de fluxos"

[dfe_desc]
other = "Um fluxo é uma composição versionada de estágios tipados; cada estágio tem um portão, artefatos e ações na entrada e na saída. O fluxo efetivo é resolvido pela cadeia plataforma, conta, workspace, projeto, demanda, e congelado quando a demanda começa. Um evento de avanço de estágio é decidido a partir das ações do estágio e da tabela de regras acumulada em ações planejadas, que o executor roda por um registro de quatro ações, registrando cada uma como aplicada por evento, regra e ação."

