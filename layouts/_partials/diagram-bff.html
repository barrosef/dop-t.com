{{/* The BFF, inside: two transports, one rule. Names are packages under
     repos/dop-api/app — routers, grpcapi, usecases, platform, coreclient. */}}
<svg class="diagram" viewBox="0 0 960 440" role="img" aria-labelledby="bff-title bff-desc">
  <title id="bff-title">{{ i18n "dbff_title" }}</title>
  <desc id="bff-desc">{{ i18n "dbff_desc" }}</desc>
  <defs><marker id="head-bff" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0 0L8 4L0 8z"></path></marker></defs>

  <!-- driving side: the two transports -->
  <text class="label" x="20" y="48">{{ i18n "dbff_driving" }}</text>
  <rect class="box" x="20" y="90" width="140" height="56" rx="6"></rect>
  <text class="name" x="34" y="112">REST · SSE</text><text class="meta" x="34" y="132">FastAPI · app/routers</text>
  <rect class="box" x="20" y="200" width="140" height="56" rx="6"></rect>
  <text class="name" x="34" y="222">gRPC</text><text class="meta" x="34" y="242">app/grpcapi</text>
  <text class="meta" x="20" y="372">{{ i18n "dbff_parity1" }}</text>
  <text class="meta" x="20" y="388">{{ i18n "dbff_parity2" }}</text>
  <text class="meta" x="20" y="404">{{ i18n "dbff_parity3" }}</text>

  <!-- the hexagon -->
  <polygon class="hex hex--outer" points="280,60 480,60 580,200 480,340 280,340 180,200"></polygon>
  <polygon class="hex" points="295,80 465,80 550,200 465,320 295,320 210,200"></polygon>
  <text class="label" x="380" y="108" text-anchor="middle">usecases</text>
  <text class="mono" x="380" y="142" text-anchor="middle">identity · hierarchy · resource</text>
  <text class="mono" x="380" y="164" text-anchor="middle">demand · workflow · execution</text>
  <text class="mono" x="380" y="186" text-anchor="middle">delivery · attention · cost</text>
  <text class="mono" x="380" y="208" text-anchor="middle">knowledge · runtime · stream</text>
  <text class="mono" x="380" y="230" text-anchor="middle">secondfactor</text>
  <text class="meta" x="380" y="268" text-anchor="middle">{{ i18n "dbff_usecase_meta1" }}</text>
  <text class="meta" x="380" y="284" text-anchor="middle">{{ i18n "dbff_usecase_meta2" }}</text>
  <text class="label" x="380" y="332" text-anchor="middle">platform</text>
  <text class="meta" x="380" y="362" text-anchor="middle">security · context · errors · logging</text>

  <path class="edge" d="M160 118 H176 V228 H160"></path>
  <path class="edge" d="M176 200 H208" marker-end="url(#head-bff)"></path>

  <!-- driven side -->
  <text class="label" x="630" y="48">{{ i18n "dbff_driven" }}</text>
  <path class="edge" d="M580 200 H604"></path>
  <path class="edge" d="M604 96 V292"></path>
  <path class="edge" d="M604 96 H630" marker-end="url(#head-bff)"></path>
  <path class="edge" d="M604 194 H630" marker-end="url(#head-bff)"></path>
  <path class="edge" d="M604 292 H630" marker-end="url(#head-bff)"></path>
  <rect class="box box--core" x="630" y="68" width="310" height="56" rx="6"></rect>
  <text class="name" x="644" y="90">coreclient → dop-core</text><text class="meta" x="644" y="110">gRPC · TLS · {{ i18n "dbff_assertion" }}</text>
  <rect class="box box--dashed" x="630" y="166" width="310" height="56" rx="6"></rect>
  <text class="name" x="644" y="188">Identity Platform</text><text class="meta" x="644" y="208">{{ i18n "dbff_verifies" }}</text>
  <rect class="box box--dashed" x="630" y="264" width="310" height="56" rx="6"></rect>
  <text class="name" x="644" y="286">Firebase Admin</text><text class="meta" x="644" y="306">{{ i18n "dbff_links" }}</text>
  <text class="port" x="20" y="430">{{ i18n "dbff_none" }}</text>
</svg>
