[dca_title]
other = "Como o core verifica seus chamadores (ADR-0022)"

[dca_desc]
other = "A pessoa entra pelo Identity Platform e o cockpit guarda o token. O cockpit o envia ao BFF como bearer. O BFF o encaminha inteiro ao core e acrescenta uma asserção assinada nomeando chamador, ator, tipo, conta, sessão e validade; no Cloud Run também leva o token de invocador. Chamadores sem pessoa enviam só a asserção. O interceptor do core verifica o token pelo port de identidade, verifica o HMAC da asserção com a chave do chamador, recusa quando token e asserção nomeiam atores diferentes, aplica o modo e deixa a decisão para a autorização. A autenticação de transporte — IAM do Cloud Run ou uma network policy — é adicional."

