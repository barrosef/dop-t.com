[dfe_applied]
other = "aplicada — idempotente"

[drs_title]
other = "O caminho da falha"

[drs_desc]
other = "Um consumidor trata uma entrega; em sucesso a mensagem é confirmada e o sucesso registrado; em falha é reentregue com backoff até cinco vezes. Uma entrega esgotada vira uma dead letter que carrega o envelope inteiro, o consumidor e as tentativas, publicada em dlq.event com id de mensagem de evento e consumidor. O consumidor da DLQ reexecuta o mesmo handler até três vezes mais; um sucesso registra; uma falha encerra a mensagem. Toda falha é classificada pela sua assinatura, aprendida depois de dois esgotamentos, e escrita no ledger de erros."

