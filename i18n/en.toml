[drs_title]
other = "The failure path"

[drs_desc]
other = "A consumer handles a delivery; on success the message is acknowledged and the success recorded; on failure it is redelivered with backoff up to five times. An exhausted delivery becomes a dead letter carrying the whole envelope, the consumer and the attempts, published to dlq.event with a message id of event and consumer. The DLQ consumer re-runs the same handler up to three more times; a success records; a failure terminates the message. Every failure is classified by its signature, learned after two exhaustions, and written to the error ledger."

