[dbff_title]
other = "The BFF, inside: two transports, one rule"

[dbff_desc]
other = "REST with SSE and gRPC are adapters that call the same use case; the use case talks to the core over gRPC with a platform assertion, and verifies the person's token with Identity Platform. It holds no database and no secret."

