{{ $current := .RelPermalink }}
<nav class="site-nav" aria-label="{{ i18n "nav_label" }}">
  {{ range $item := slice
       (dict "key" "nav_product" "url" ("/" | relLangURL))
       (dict "key" "nav_architecture" "url" ("architecture/" | relLangURL))
       (dict "key" "nav_status" "url" ("status/" | relLangURL)) }}
  <a href="{{ $item.url }}"{{ if eq $current $item.url }} aria-current="page"{{ end }}>{{ i18n $item.key }}</a>
  {{ end }}
</nav>
