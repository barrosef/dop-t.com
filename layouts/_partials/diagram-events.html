{{/* The event pipeline. The flow engine and the failure path are two
     sub-processes: collapsed here as BPMN-style blocks (the [+] marker),
     each drawn in its own figure below and reachable by clicking. */}}
<svg class="diagram" viewBox="0 0 1000 400" role="img" aria-labelledby="ev-title ev-desc">
  <title id="ev-title">{{ i18n "dev_title" }}</title>
  <desc id="ev-desc">{{ i18n "dev_desc" }}</desc>
  <defs><marker id="head-ev" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0 0L8 4L0 8z"></path></marker></defs>

  <!-- the pipeline -->
  <rect class="box" x="20" y="30" width="130" height="52" rx="6"></rect>
  <text class="name" x="34" y="52">{{ i18n "dev_write" }}</text><text class="meta" x="34" y="70">Postgres · tx</text>
  <path class="edge" d="M150 56 H190" marker-end="url(#head-ev)"></path>
  <rect class="box" x="190" y="30" width="130" height="52" rx="6"></rect>
  <text class="name" x="204" y="52">outbox</text><text class="meta" x="204" y="70">{{ i18n "dev_same_tx" }}</text>
  <path class="edge" d="M320 56 H360" marker-end="url(#head-ev)"></path>
  <rect class="box" x="360" y="30" width="130" height="52" rx="6"></rect>
  <text class="name" x="374" y="52">relay</text><text class="meta" x="374" y="70">at-least-once</text>
  <path class="edge" d="M490 56 H530" marker-end="url(#head-ev)"></path>
  <rect class="box box--core" x="530" y="30" width="170" height="52" rx="6"></rect>
  <text class="name" x="544" y="52">NATS JetStream</text><text class="meta" x="544" y="70">dop.&gt; · dlq.&gt;</text>
  <path class="edge edge--dashed" d="M700 56 H760"></path>
  <rect class="box" x="760" y="30" width="220" height="52" rx="6"></rect>
  <text class="name" x="774" y="52">Envelope</text><text class="meta" x="774" y="70">aggregate · actor · request</text>

  <!-- the consumers, each fed by the bus -->
  <path class="edge" d="M615 82 V110 H90 V140" marker-end="url(#head-ev)"></path>
  <path class="edge" d="M320 110 V140" marker-end="url(#head-ev)"></path>
  <path class="edge" d="M520 110 V140" marker-end="url(#head-ev)"></path>
  <path class="edge" d="M615 110 H720 V140" marker-end="url(#head-ev)"></path>
  <rect class="box box--dashed" x="20" y="140" width="140" height="44" rx="6"></rect>
  <text class="name" x="34" y="159">dispatcher</text><text class="meta" x="34" y="175">{{ i18n "dev_planned" }}</text>
  <rect class="box" x="250" y="140" width="140" height="44" rx="6"></rect>
  <text class="name" x="264" y="159">timeline</text><text class="meta" x="264" y="175">{{ i18n "dev_projection" }}</text>
  <rect class="box" x="450" y="140" width="140" height="44" rx="6"></rect>
  <text class="name" x="464" y="159">attention</text><text class="meta" x="464" y="175">{{ i18n "dev_projection" }}</text>
  <rect class="box" x="650" y="140" width="140" height="44" rx="6"></rect>
  <text class="name" x="664" y="159">notification</text><text class="meta" x="664" y="175">Mailer · SMSer</text>

  <!-- every consumer's delivery is covered by the same failure path -->
  <path class="edge" d="M90 184 V214"></path>
  <path class="edge" d="M320 184 V214"></path>
  <path class="edge" d="M520 184 V214"></path>
  <path class="edge" d="M720 184 V214"></path>
  <path class="edge" d="M90 214 H720"></path>
  <path class="edge" d="M720 214 V262" marker-end="url(#head-ev)"></path>
  <text class="meta" x="734" y="244">{{ i18n "dev_on_failure" }}</text>

  <!-- the dispatcher is what will drive the flow engine -->
  <path class="edge edge--dashed" d="M90 214 V262" marker-end="url(#head-ev)"></path>

  <!-- two sub-processes, collapsed -->
  <a href="#flow-engine">
    <rect class="box box--sub" x="20" y="262" width="400" height="96" rx="8"></rect>
    <text class="name" x="36" y="290">{{ i18n "dev_engine" }}</text>
    <text class="meta" x="36" y="310">ADR-0010 · Decide → PlannedAction → Execute</text>
    <text class="meta" x="36" y="338">{{ i18n "dev_subprocess" }} ↓</text>
    <rect class="box" x="210" y="340" width="20" height="14" rx="2"></rect>
    <text class="mono" x="220" y="351" text-anchor="middle">+</text>
  </a>
  <a href="#resilience">
    <rect class="box box--sub" x="560" y="262" width="420" height="96" rx="8"></rect>
    <text class="name" x="576" y="290">{{ i18n "dev_failure" }}</text>
    <text class="meta" x="576" y="310">ADR-0014 · NAK ×5 → dlq.event → event_errors</text>
    <text class="meta" x="576" y="338">{{ i18n "dev_subprocess" }} ↓</text>
    <rect class="box" x="760" y="340" width="20" height="14" rx="2"></rect>
    <text class="mono" x="770" y="351" text-anchor="middle">+</text>
  </a>
</svg>
