[dev_title]
other = "Events and the flow engine"

[dev_desc]
other = "A write commits its event to the outbox in the same transaction; a relay publishes it to NATS JetStream; four consumers react; an exhausted delivery goes to one dead-letter queue, is classified and recorded. The flow engine — stages with actions on enter and exit, and a rules table that accumulates down the hierarchy — decides what an event triggers; its dispatcher is planned and not wired yet."

