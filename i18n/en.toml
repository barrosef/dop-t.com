[dfe_title]
other = "The flow engine"

[dfe_desc]
other = "A flow is a versioned composition of typed stages; each stage has a gate, artifacts and actions on enter and exit. The effective flow is resolved down the chain platform, account, workspace, project, demand, and frozen when the demand starts. A stage-advanced event is decided from the flow's stage actions and from the accumulated rules table into planned actions, which the executor runs through a registry of four actions, recording each as applied per event, rule and action."

