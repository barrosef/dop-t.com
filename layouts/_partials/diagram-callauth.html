{{/* ADR-0022 as blocks and arrows: the hops, the two signatures, the
     interceptor's steps, the transport frame. Words stay on the caption. */}}
<svg class="diagram" viewBox="0 0 1000 400" role="img" aria-labelledby="ca-title ca-desc">
  <title id="ca-title">{{ i18n "dca_title" }}</title>
  <desc id="ca-desc">{{ i18n "dca_desc" }}</desc>
  <defs><marker id="head-ca" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0 0L8 4L0 8z"></path></marker></defs>

  <!-- the transport frame around the core -->
  <rect class="box box--dashed" x="640" y="30" width="340" height="350" rx="10"></rect>
  <text class="label" x="656" y="52">{{ i18n "dca_transport_short" }}</text>
  <text class="meta" x="656" y="70">Cloud Run IAM · NetworkPolicy</text>

  <!-- hops -->
  <rect class="box box--dashed" x="20" y="120" width="140" height="56" rx="6"></rect>
  <text class="name" x="34" y="144">Identity Platform</text><text class="meta" x="34" y="164">{{ i18n "dca_signin" }}</text>
  <path class="edge edge--dashed" d="M160 148 H210" marker-end="url(#head-ca)"></path>
  <text class="meta" x="185" y="138" text-anchor="middle">id token</text>

  <rect class="box" x="210" y="120" width="140" height="56" rx="6"></rect>
  <text class="name" x="224" y="144">{{ i18n "dca_cockpit" }}</text><text class="meta" x="224" y="164">dop-app</text>
  <path class="edge" d="M350 148 H400" marker-end="url(#head-ca)"></path>
  <text class="meta" x="375" y="138" text-anchor="middle">Bearer</text>

  <rect class="box" x="400" y="120" width="150" height="56" rx="6"></rect>
  <text class="name" x="414" y="144">BFF</text><text class="meta" x="414" y="164">dop-api</text>
  <path class="edge" d="M550 148 H660" marker-end="url(#head-ca)"></path>
  <text class="meta" x="605" y="138" text-anchor="middle">token + assertion</text>

  <rect class="box" x="400" y="220" width="150" height="56" rx="6"></rect>
  <text class="name" x="414" y="244">worker · sched</text><text class="meta" x="414" y="264">launcher</text>
  <path class="edge" d="M550 248 H660" marker-end="url(#head-ca)"></path>
  <text class="meta" x="605" y="238" text-anchor="middle">assertion</text>

  <!-- the core and its interceptor chain -->
  <rect class="box box--core" x="660" y="96" width="300" height="264" rx="8"></rect>
  <text class="name" x="676" y="120">core</text><text class="meta" x="720" y="120">{{ i18n "dca_interceptor_short" }}</text>

  <rect class="box" x="676" y="136" width="130" height="40" rx="6"></rect>
  <text class="name" x="688" y="153">{{ i18n "dca_s1" }}</text><text class="meta" x="688" y="168">token · IdP</text>
  <path class="edge" d="M806 156 H830" marker-end="url(#head-ca)"></path>
  <rect class="box" x="830" y="136" width="114" height="40" rx="6"></rect>
  <text class="name" x="842" y="153">{{ i18n "dca_s2" }}</text><text class="meta" x="842" y="168">HMAC · 2 min</text>

  <path class="edge" d="M887 176 V200" marker-end="url(#head-ca)"></path>
  <path class="edge" d="M741 176 V200" marker-end="url(#head-ca)"></path>
  <rect class="box" x="676" y="200" width="268" height="40" rx="6"></rect>
  <text class="name" x="688" y="217">{{ i18n "dca_s3" }}</text><text class="meta" x="688" y="232">{{ i18n "dca_s3_meta" }}</text>

  <path class="edge" d="M810 240 V264" marker-end="url(#head-ca)"></path>
  <rect class="box" x="676" y="264" width="268" height="40" rx="6"></rect>
  <text class="name" x="688" y="281">{{ i18n "dca_s4" }}</text><text class="meta" x="688" y="296">strict · permissive · off</text>

  <path class="edge" d="M810 304 V328" marker-end="url(#head-ca)"></path>
  <rect class="box" x="676" y="328" width="268" height="24" rx="6"></rect>
  <text class="name" x="688" y="345">{{ i18n "dca_s5" }}</text>
</svg>
