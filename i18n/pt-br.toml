[dev_title]
other = "Eventos e o motor de fluxos"

[dev_desc]
other = "Uma escrita commita o seu evento na outbox na mesma transação; um relay publica no NATS JetStream; quatro consumidores reagem; uma entrega esgotada vai para uma única fila de dead letters, é classificada e registrada. O motor de fluxos — estágios com ações na entrada e na saída, e uma tabela de regras que acumula pela hierarquia — decide o que um evento dispara; o seu dispatcher está planejado e ainda não ligado."

