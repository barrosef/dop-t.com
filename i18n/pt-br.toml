[dbff_title]
other = "O BFF por dentro: dois transportes, uma regra"

[dbff_desc]
other = "REST com SSE e gRPC são adaptadores que chamam o mesmo caso de uso; o caso de uso fala com o core por gRPC com uma asserção da plataforma, e verifica o token da pessoa no Identity Platform. Não tem banco nem segredo."

